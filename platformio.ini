[platformio]
src_dir = firmware

[env]
framework    = arduino
lib_ldf_mode = chain+
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
fw_libs      = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
online_flags = -DLV_ONLINE -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=6 -DDEFAULT_STORAGE_TYPE_ESP32=5 -I${this.fw_libs}/WiFi/src -I${this.fw_libs}/Network/src -I${this.fw_libs}/FS/src -I${this.fw_libs}/SD/src -I${this.fw_libs}/SPI/src
online_libs  =
    xreef/SimpleFTPServer @ ^2.1.0
    file://${this.fw_libs}/Network
    WiFi
    FS
    SD
    SPI

[env:esp32_wrover]
extends = esp32_base
board   = esp-wrover-kit

[env:esp32_wrover_online]
extends     = env:esp32_wrover
build_flags = ${esp32_base.online_flags}
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    ${esp32_base.online_libs}

[env:nano_esp32]
extends         = esp32_base
board           = arduino_nano_esp32
upload_protocol = dfu
build_flags     = -DBOARD_USES_HW_GPIO_NUMBERS -DARDUINO_NANO_ESP32

[env:nano_esp32_online]
extends     = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} ${esp32_base.online_flags}
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    ${esp32_base.online_libs}

[env:nucleo_f303k8]
platform    = ststm32
board       = nucleo_f303k8
build_flags = -DHAL_DAC_MODULE_ENABLED

[avr_base]
platform = atmelavr
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Servo @ ^1.2.0

[env:uno]
extends = avr_base
board   = uno

[env:nano]
extends = avr_base
board   = nanoatmega328
