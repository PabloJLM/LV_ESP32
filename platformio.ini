; ============================================================================
;  LV_ESP32 - un solo proyecto, un entorno por placa
;
;  Compilar todo:     pio run
;  Una placa:         pio run -e esp32_wrover
;  Lo que sale va a   .pio\build\<entorno>\   y se copia a firmware\bin\
;  (ver firmware\COMPILAR.md: nombres de archivo y como unir el ESP32)
;
;  El nombre del entorno = nombre del archivo en firmware\bin\ = clave de la
;  placa en tools\lv_core.py.
; ============================================================================

[platformio]
src_dir = firmware

; ---- comun a todas ---------------------------------------------------------
[env]
framework    = arduino
lib_ldf_mode = chain+
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ---- ESP32 ----------------------------------------------------------------
; OJO: la plataforma OFICIAL "espressif32" trae Arduino-ESP32 2.x y el firmware
; usa ledcAttachChannel (solo existe en 3.x). Por eso se usa pioarduino.
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
fw_libs      = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
online_flags = -DLV_ONLINE -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=6 -DDEFAULT_STORAGE_TYPE_ESP32=5 -I${this.fw_libs}/WiFi/src -I${this.fw_libs}/Network/src -I${this.fw_libs}/FS/src -I${this.fw_libs}/SD/src -I${this.fw_libs}/SPI/src
; Network no se resuelve por nombre (PlatformIO lo busca en el registro): va por ruta.
online_libs  =
    xreef/SimpleFTPServer @ ^2.1.0
    file://${this.fw_libs}/Network
    WiFi
    FS
    SD
    SPI

[env:esp32_wrover]
extends = esp32_base
board   = esp-wrover-kit

[env:esp32_wrover_online]
extends     = env:esp32_wrover
build_flags = ${esp32_base.online_flags}
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    ${esp32_base.online_libs}

; Nano ESP32: se carga por DFU con el firmware.bin tal cual (sin unir).
; BOARD_USES_HW_GPIO_NUMBERS = "Pin numbering: by GPIO number": sin esto
; Adafruit_NeoPixel no enlaza con el remapeo de pines de esa placa.
[env:nano_esp32]
extends         = esp32_base
board           = arduino_nano_esp32
upload_protocol = dfu
build_flags     = -DBOARD_USES_HW_GPIO_NUMBERS -DARDUINO_NANO_ESP32

[env:nano_esp32_online]
extends     = env:nano_esp32
build_flags = ${env:nano_esp32.build_flags} ${esp32_base.online_flags}
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    ${esp32_base.online_libs}

; ---- STM32 ----------------------------------------------------------------
; HAL_DAC_MODULE_ENABLED activa el DAC real de PA4.
[env:nucleo_f303k8]
platform    = ststm32
board       = nucleo_f303k8
build_flags = -DHAL_DAC_MODULE_ENABLED

; ---- AVR ------------------------------------------------------------------
; Servo no viene con el core de AVR, se baja como libreria.
[avr_base]
platform = atmelavr
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Servo @ ^1.2.0

[env:uno]
extends = avr_base
board   = uno

; nanoatmega328 = bootloader viejo (57600). Si tu Nano es nuevo, usa
; nanoatmega328new (115200) y cambia la velocidad en tools\lv_core.py.
[env:nano]
extends = avr_base
board   = nanoatmega328
